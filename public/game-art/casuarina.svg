    <pattern id="paper" width="17" height="19" patternUnits="userSpaceOnUse"><path d="m2 4 1-.3m10 6 .8.3m-7 6 1-.4" stroke="#cadbb4" stroke-width=".8" opacity=".19"/></pattern>
    <linearGradient id="stem"><stop stop-color="#485a37"/><stop offset=".18" stop-color="#859455"/><stop offset=".41" stop-color="#c7c786"/><stop offset=".61" stop-color="#8c9e60"/><stop offset="1" stop-color="#4d694b"/></linearGradient>
    <linearGradient id="scales" x2=".5" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#e7c78e"/><stop offset="1" stop-color="#86975a"/></linearGradient>
    <radialGradient id="lens"><stop stop-color="#384f3d"/><stop offset="1" stop-color="#1d3932"/></radialGradient>
    <clipPath id="detail"><circle cx="300" cy="160" r="110"/></clipPath>
