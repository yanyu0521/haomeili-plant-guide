    <use href="#spray" transform="translate(54 32) rotate(8) scale(1.46 1.6)"/>
    <use href="#spray" transform="translate(102 48) rotate(-2) scale(1.06 1.3)"/>
    <use href="#spray" transform="translate(158 48) rotate(18) scale(.77 1.01)"/>
    <use href="#spray" transform="translate(224 25) rotate(26) scale(.58 .79)"/>
  </g>
  <g transform="translate(585 1) scale(-1 1)" opacity=".45"><use href="#spray" transform="rotate(-10) scale(1.35 1.2)"/><use href="#spray" transform="translate(38 0) rotate(14) scale(1.05)"/></g>
